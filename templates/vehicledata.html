<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Insurance Prediction</title>

    <!-- Stylesheet served from FastAPI's static mount (e.g. app.mount("/static", StaticFiles(...))).
         Left unchanged. If static assets ever move behind S3 / CloudFront, swap this href for
         the CDN URL, e.g. href="https://<your-cloudfront-domain>/css/style.css" -->
    <link rel="stylesheet" href="/static/css/style.css">

    <!-- OPTIONAL: favicon hosted on S3 — uncomment and set the real URL if you add one
    <link rel="icon" href="https://<your-s3-bucket>.s3.amazonaws.com/favicon.ico"> -->
</head>
<body>

    <header class="page-header">
        <div class="page-header__inner">
            <!-- OPTIONAL: brand logo hosted on S3 — uncomment and set the real URL
            <img class="page-header__logo" src="https://<your-s3-bucket>.s3.amazonaws.com/logo.svg" alt="Company logo"> -->
            <h1>Vehicle Insurance Prediction</h1>
            <p class="page-header__subtitle">Enter applicant, vehicle and policy details to score a cross-sell prediction.</p>
        </div>
    </header>

    <main class="container">

        <!-- PREDICTION FORM
             action="/" method="post" — maps to the existing FastAPI POST route that runs the
             model and re-renders this template with `context`.
             Do not change method, action, or any input id/name below: the backend reads the
             submitted values by `name` via request.form(), regardless of the surrounding
             div/fieldset markup, so the grouping here is safe to add. -->
        <form method="post" action="/" class="predict-form">

            <fieldset class="field-group">
                <legend>Applicant</legend>
                <div class="field-group__grid">

                    <div class="field">
                        <label for="Gender">Gender (1: Male, 0: Female):</label>
                        <input type="number" id="Gender" name="Gender" min="0" max="1" required>
                    </div>

                    <div class="field">
                        <label for="Age">Age:</label>
                        <input type="number" id="Age" name="Age" required>
                    </div>

                    <div class="field">
                        <label for="Driving_License">Driving License (0: No, 1: Yes):</label>
                        <input type="number" id="Driving_License" name="Driving_License" min="0" max="1" required>
                    </div>

                    <div class="field">
                        <label for="Region_Code">Region Code:</label>
                        <input type="number" step="0.01" id="Region_Code" name="Region_Code" required>
                    </div>
                </div>
            </fieldset>

            <fieldset class="field-group">
                <legend>Policy history</legend>
                <div class="field-group__grid">

                    <div class="field">
                        <label for="Previously_Insured">Previously Insured (0: No, 1: Yes):</label>
                        <input type="number" id="Previously_Insured" name="Previously_Insured" min="0" max="1" required>
                    </div>

                    <div class="field">
                        <label for="Annual_Premium">Annual Premium:</label>
                        <input type="number" step="0.01" id="Annual_Premium" name="Annual_Premium" required>
                    </div>

                    <div class="field">
                        <label for="Policy_Sales_Channel">Policy Sales Channel:</label>
                        <input type="number" step="0.01" id="Policy_Sales_Channel" name="Policy_Sales_Channel" required>
                    </div>

                    <div class="field">
                        <label for="Vintage">Vintage:</label>
                        <input type="number" id="Vintage" name="Vintage" required>
                    </div>
                </div>
            </fieldset>

            <fieldset class="field-group">
                <legend>Vehicle</legend>
                <div class="field-group__grid">

                    <div class="field">
                        <label for="Vehicle_Age_lt_1_Year">Vehicle Age &lt; 1 Year (0: No, 1: Yes):</label>
                        <input type="number" id="Vehicle_Age_lt_1_Year" name="Vehicle_Age_lt_1_Year" min="0" max="1" required>
                    </div>

                    <div class="field">
                        <label for="Vehicle_Age_gt_2_Years">Vehicle Age &gt; 2 Years (0: No, 1: Yes):</label>
                        <input type="number" id="Vehicle_Age_gt_2_Years" name="Vehicle_Age_gt_2_Years" min="0" max="1" required>
                    </div>

                    <div class="field field--full">
                        <label for="Vehicle_Damage_Yes">Vehicle Damage (0: No, 1: Yes):</label>
                        <input type="number" id="Vehicle_Damage_Yes" name="Vehicle_Damage_Yes" min="0" max="1" required>
                    </div>
                </div>
            </fieldset>

            <button type="submit">Predict</button>
        </form>

        <!-- TRAIN MODEL FORM
             action="/train" method="get" — maps to the existing FastAPI route that (re)trains
             the model. Kept as its own separate GET form exactly as before. -->
        <form method="get" action="/train" class="train-form">
            <p class="train-form__hint">Retrain the model using the latest data.</p>
            <button type="submit" class="train-button">Train Model</button>
        </form>

        <!-- RESULT
             `context` is injected by the backend (Jinja2) after a prediction is made.
             If the API response ever includes extra fields (e.g. a probability score),
             reference them here the same way, e.g. {{ context.probability }},
             without touching the form logic above. -->
        {% if context %}
            <div class="result">
                <h2>Result: {{ context }}</h2>
            </div>
        {% endif %}

    </main>
</body>
</html>
